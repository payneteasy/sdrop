# Release on a version tag: tests, binaries for five platforms, SHA256SUMS, build provenance
# attestation, GitHub Release with fixed file names (…/releases/latest/download/<name>).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: sdrop-linux-x86_64, native: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: sdrop-linux-aarch64, native: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: sdrop-macos-arm64, native: true }
          - { os: macos-latest, target: x86_64-apple-darwin, name: sdrop-macos-x86_64, native: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: sdrop-windows-x86_64.exe, native: true }
    runs-on: ${{ matrix.os }}
    env:
      # The built-in service comes from the repository variable, not from the code.
      SDROP_DEFAULT_ORIGIN: ${{ vars.SDROP_DEFAULT_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag must match the crate version (sdrop --version).
      - shell: bash
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # Release build: without test-loopback.
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          src=target/${{ matrix.target }}/release/sdrop
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist/${{ matrix.name }}"
      # The release binary must refuse http:// even when asked to.
      - if: matrix.native
        shell: bash
        run: |
          out=$(SDROP_ORIGIN=http://127.0.0.1:9 "dist/${{ matrix.name }}" status "http://127.0.0.1:9/o/$(printf '0%.0s' $(seq 64))#AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" 2>&1) && exit 1
          echo "$out" | grep -q "not an allowed origin"
          "dist/${{ matrix.name }}" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum sdrop-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sdrop-*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "sdrop $TAG" --notes "Binaries for Linux (static), macOS and Windows. Check them with SHA256SUMS and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
