# cargo deny check (CI): vulnerabilities, licenses, crate sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# BSL-1.0 (Boost, permissive, OSI approved): clipboard-win and error-code, the Windows clipboard of arboard.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[licenses.private]
# sdrop is not published (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
